<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Calculator</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
        }

        h2 { text-align: center; color: var(--primary); margin-bottom: 1.5rem; }

        .input-group { margin-bottom: 1rem; }

        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; opacity: 0.8; }

        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            font-size: 1rem;
        }

        input:focus { outline: none; border-color: var(--primary); }

        .result-box {
            background: #f1f5f9;
            padding: 1.5rem;
            border-radius: 12px;
            margin-top: 2rem;
            text-align: center;
        }

        .total-label { font-size: 0.9rem; margin-bottom: 0.5rem; }
        .total-amount { font-size: 2rem; font-weight: 800; color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h2>Paycheck Calcu</h2>
    
    <div class="input-group">
        <label>Regular OT (Hours)</label>
        <input type="number" id="regOT" value="0" oninput="calculate()">
    </div>

    <div class="input-group">
        <label>Saturdays Worked (Rest Day)</label>
        <input type="number" id="satOT" value="0" oninput="calculate()">
    </div>

    <div class="input-group">
        <label>Sundays Worked (Rest Day)</label>
        <input type="number" id="sunOT" value="0" oninput="calculate()">
    </div>

    <div class="input-group">
        <label>Absents (Days - use 0.5 for half day)</label>
        <input type="number" id="absents" value="0" step="0.5" oninput="calculate()">
    </div>

    <div class="input-group">
        <label>Added Allowance</label>
        <input type="number" id="allowance" value="0" oninput="calculate()">
    </div>

    <div class="result-box">
        <div class="total-label">Estimated Total Salary</div>
        <div class="total-amount" id="totalDisplay">₱ 5,981.25</div>
    </div>
</div>

<script>
    function calculate() {
        const basic = 5981.25;
        const regRate = 85.9375;
        const satRate = 715;
        const sunRate = 915;
        const absentDeduction = 550;

        const regOT = parseFloat(document.getElementById('regOT').value) || 0;
        const satDays = parseFloat(document.getElementById('satOT').value) || 0;
        const sunDays = parseFloat(document.getElementById('sunOT').value) || 0;
        const absents = parseFloat(document.getElementById('absents').value) || 0;
        const allowance = parseFloat(document.getElementById('allowance').value) || 0;

        // Note: 0.5 day absent = 225 according to your rule (slightly different from 550/2)
        let totalDeduction = 0;
        if (absents === 0.5) {
            totalDeduction = 225;
        } else {
            totalDeduction = absents * absentDeduction;
        }

        const earnings = (basic - totalDeduction) + (regOT * regRate) + (satDays * satRate) + (sunDays * sunRate) + allowance;

        document.getElementById('totalDisplay').innerText = "₱ " + earnings.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }
</script>

</body>
</html>
